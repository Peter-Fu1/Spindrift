name: MAIN release upgrade laboratory
on:
  workflow_dispatch:
  push:
    branches: ['android/main-release-*']
    paths: ['app/**', 'tools/**', '.github/workflows/main-release-upgrade.yml']
permissions:
  contents: read
concurrency:
  group: main-upgrade-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_AVD_HOME: /tmp/hoyo-main-avd
      HOYO_UPGRADE_TEST_KEY: /tmp/main-upgrade-lab.p12
      HOYO_UPGRADE_TEST_PASSWORD: isolated-ci-fixture-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare isolated emulator and disposable test keys
        timeout-minutes: 8
        run: |
          sdkmanager 'emulator' 'platforms;android-35' 'build-tools;35.0.0' 'system-images;android-35;google_apis;x86_64'
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force -n main-upgrade -p "$ANDROID_AVD_HOME/main-upgrade.avd" -k 'system-images;android-35;google_apis;x86_64'
          sudo chmod 666 /dev/kvm
          keytool -genkeypair -alias upgrade-lab -keyalg RSA -keysize 2048 -validity 2 -storetype PKCS12 -keystore "$HOYO_UPGRADE_TEST_KEY" -storepass:env HOYO_UPGRADE_TEST_PASSWORD -keypass:env HOYO_UPGRADE_TEST_PASSWORD -dname 'CN=Disposable CI upgrade fixture' > /dev/null 2>&1
          "$ANDROID_HOME/emulator/emulator" -avd main-upgrade -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > emulator.log 2>&1 &
          timeout 180s adb wait-for-device
          for n in $(seq 1 120); do [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ] && break; sleep 2; done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          # Wait for connectivity itself; grep 'found' also matches 'not found'.
          for n in $(seq 1 60); do
            if adb shell service check connectivity | tr -d '\r' | grep -Fxq 'Service connectivity: found'; then break; fi
            sleep 2
          done
          adb shell service check connectivity | tr -d '\r' | grep -Fxq 'Service connectivity: found'
          adb shell cmd connectivity airplane-mode enable
          adb shell svc wifi disable
          test "$(adb shell settings get global airplane_mode_on | tr -d '\r')" = 1
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          adb shell input keyevent 82
      - name: Install non-debuggable MAIN code19 and seed synthetic state
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain -PmainUpgradeTest=true -PmainTestVersionCode=19 assembleRelease assembleReleaseAndroidTest > upgrade-build19.txt 2>&1 || { tail -n 120 upgrade-build19.txt; exit 1; }
          adb install -t app/build/outputs/apk/release/app-release.apk
          adb install -t app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
          adb shell am start -W -n io.github.peterfu.hoyoreminder/.MainActivity > upgrade-main-launch.txt
          sleep 3
          test -n "$(adb shell pidof io.github.peterfu.hoyoreminder | tr -d '\r')"
          adb exec-out screencap -p > main-first-launch.png
          adb shell am force-stop io.github.peterfu.hoyoreminder
          timeout 90s adb shell am instrument -w -e class io.github.peterfu.hoyoreminder.MainReleaseUpgradeTest -e mainUpgradeTest true -e mainUpgradePhase seed io.github.peterfu.hoyoreminder.test/androidx.test.runner.AndroidJUnitRunner > upgrade-seed.txt
          grep -q 'OK (1 test)' upgrade-seed.txt
          adb shell am force-stop io.github.peterfu.hoyoreminder
      - name: Actual same-certificate code20 replacement retains data
        run: |
          ./gradlew --no-daemon --console=plain -PmainUpgradeTest=true -PmainTestVersionCode=20 assembleRelease > upgrade-build20.txt 2>&1 || { tail -n 120 upgrade-build20.txt; exit 1; }
          adb install -r -t app/build/outputs/apk/release/app-release.apk > upgrade-install.txt
          grep -q Success upgrade-install.txt
          adb shell am instrument -w -e class io.github.peterfu.hoyoreminder.MainReleaseUpgradeTest -e mainUpgradeTest true -e mainUpgradePhase restore io.github.peterfu.hoyoreminder.test/androidx.test.runner.AndroidJUnitRunner > upgrade-restore.txt
          grep -q 'OK (1 test)' upgrade-restore.txt
      - name: Wrong certificate is rejected without deleting original data
        run: |
          keytool -genkeypair -alias wrong -keyalg RSA -keysize 2048 -validity 2 -storetype PKCS12 -keystore /tmp/wrong.p12 -storepass:env HOYO_UPGRADE_TEST_PASSWORD -keypass:env HOYO_UPGRADE_TEST_PASSWORD -dname 'CN=Wrong disposable fixture' > /dev/null 2>&1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks /tmp/wrong.p12 --ks-key-alias wrong --ks-pass env:HOYO_UPGRADE_TEST_PASSWORD --out /tmp/wrong.apk app/build/outputs/apk/release/app-release.apk
          if adb install -r -t /tmp/wrong.apk > wrong-signature.txt 2>&1; then echo 'Wrong-key update unexpectedly succeeded'; exit 1; fi
          grep -q INSTALL_FAILED_UPDATE_INCOMPATIBLE wrong-signature.txt
          adb shell am force-stop io.github.peterfu.hoyoreminder
          adb shell am instrument -w -e class io.github.peterfu.hoyoreminder.MainReleaseUpgradeTest -e mainUpgradeTest true -e mainUpgradePhase after-rejected io.github.peterfu.hoyoreminder.test/androidx.test.runner.AndroidJUnitRunner > upgrade-after-rejected.txt
          grep -q 'OK (1 test)' upgrade-after-rejected.txt
          adb pull /sdcard/Android/data/io.github.peterfu.hoyoreminder/files/main-upgrade main-upgrade-evidence

      - name: Preserve actual isolated process failure evidence
        timeout-minutes: 2
        if: always()
        run: |
          timeout 20s adb logcat -d -b crash > upgrade-crash.txt 2>&1 || true
          timeout 20s adb logcat -d -s AndroidRuntime:E > upgrade-runtime-crash.txt 2>&1 || true
          timeout 10s adb emu kill || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: main-upgrade-test-evidence
          path: |
            upgrade-*.txt
            wrong-signature.txt
            main-first-launch.png
            emulator.log
            main-upgrade-evidence/
          retention-days: 14
