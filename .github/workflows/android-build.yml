name: Android Build
on:
  workflow_dispatch:
  push:
    branches: [main, 'android/**']
    paths-ignore: ['docs/**', 'reference/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', 'reference/**', '**.md']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Pinned launcher verification dependency
        run: python3 -m pip install Pillow==13.0.0
      - name: Web and package contract tests
        run: |
          node --test tests/web/*.test.mjs
          python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain testDebugUnitTest lintDebug assembleDebug assembleRelease assemblePreview assembleLegacyUpgrade :app:dependencies > build-output.txt 2>&1 || { tail -n 150 build-output.txt; exit 1; }
      - name: Verify packaged UI matches this checkout
        run: |
          python3 tools/verify_apk_ui.py --report apk-ui-verification.json app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk app/build/outputs/apk/preview/*.apk app/build/outputs/apk/legacyUpgrade/*.apk
      - name: Verify packaged MAIN launcher pixels and mapping
        run: |
          python3 tools/verify_launcher.py app/build/outputs/apk/release/app-release-unsigned.apk --report main-icon-verification.json
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump resources app/build/outputs/apk/release/app-release-unsigned.apk > main-resources.txt
      - name: Verify unsigned MAIN alignment before local signing
        run: python3 tools/write_alignment_receipt.py app/build/outputs/apk/release/app-release-unsigned.apk "$ANDROID_HOME/build-tools/35.0.0/zipalign" main-alignment-receipt.json
      - name: APK checksums and size
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk > apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > apk-badging.txt
          find app/build/outputs/apk -name '*.apk' -exec sha256sum {} \; -exec stat -c '%s %n' {} \; | tee apk-metrics.txt
      - name: Export public signing tool for LOCAL signing only
        run: cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apksigner.jar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HoYoReminder-preview-unsigned
          path: |
            app/build/outputs/apk/preview/*.apk
            apksigner.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HoYoReminder-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: build-evidence
          path: |
            build-output.txt
            apk-metrics.txt
            apk-ui-verification.json
            main-icon-verification.json
            main-resources.txt
            main-alignment-receipt.json
            main-alignment-receipt.txt
            main-apk-badging.txt
            apk-signature.txt
            apk-badging.txt
            app/build/reports/
            app/build/test-results/
            app/build/outputs/mapping/
            app/build/outputs/apk/release/
            app/build/outputs/apk/legacyUpgrade/
          retention-days: 14
