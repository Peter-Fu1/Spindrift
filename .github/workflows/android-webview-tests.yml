name: Android WebView Integration
on:
  workflow_dispatch:
  push:
    branches: ['android/**']
    paths: ['app/**', 'web/**', '.github/workflows/android-webview-tests.yml']
permissions:
  contents: read
concurrency:
  group: webview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  webview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_AVD_HOME: /tmp/hoyoreminder-avd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install emulator and pinned SDK
        run: |
          sdkmanager 'platform-tools' 'emulator' 'platforms;android-35' 'build-tools;35.0.0' 'system-images;android-35;google_apis;x86_64'
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force -n hoyo-widget -p "$ANDROID_AVD_HOME/hoyo-widget.avd" -k 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -list-avds
          sudo chmod 666 /dev/kvm
      - name: Run real WebView with offline widget fixture
        run: |
          "$ANDROID_HOME/emulator/emulator" -avd hoyo-widget -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > emulator.log 2>&1 &
          timeout 180s adb wait-for-device
          for n in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell input keyevent 82
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain connectedDebugAndroidTest > webview-tests.txt 2>&1 || { tail -n 100 webview-tests.txt; exit 1; }
          # AGP removes the test apps after connected tests. Reinstall this same build for an explicit process boundary.
          adb install -r -t app/build/outputs/apk/debug/app-debug.apk
          adb install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell am instrument -w -e class io.github.peterfu.hoyoreminder.ProcessRestartTest -e stage36Phase seed io.github.peterfu.hoyoreminder.debug.test/androidx.test.runner.AndroidJUnitRunner > process-seed.txt
          grep -q 'OK (1 test)' process-seed.txt
          adb shell am force-stop io.github.peterfu.hoyoreminder.debug
          adb shell svc wifi disable
          adb shell svc data disable
          adb shell am instrument -w -e class io.github.peterfu.hoyoreminder.ProcessRestartTest -e stage36Phase restore io.github.peterfu.hoyoreminder.debug.test/androidx.test.runner.AndroidJUnitRunner > process-restore.txt
          grep -q 'OK (1 test)' process-restore.txt
          adb pull /sdcard/Android/data/io.github.peterfu.hoyoreminder.debug/files/stage36 stage36-lifecycle
          adb pull /sdcard/Android/data/io.github.peterfu.hoyoreminder.debug/files/stage33 stage33-screenshots || true
          # connected tests uninstall their APKs, deleting external app files. Re-run
          # just the icon check after the explicit reinstall, then pull before teardown.
          adb shell am instrument -w -e class io.github.peterfu.hoyoreminder.IconContractTest io.github.peterfu.hoyoreminder.debug.test/androidx.test.runner.AndroidJUnitRunner > icon-contract.txt
          grep -q 'OK (1 test)' icon-contract.txt
          adb pull /sdcard/Android/data/io.github.peterfu.hoyoreminder.debug/files/stage41 stage41-icons
          adb emu kill
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: webview-integration-evidence
          path: |
            webview-tests.txt
            emulator.log
            process-seed.txt
            process-restore.txt
            icon-contract.txt
            stage36-lifecycle/
            stage33-screenshots/
            stage41-icons/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
