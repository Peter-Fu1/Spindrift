<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>HoYoReminder · 本地 UI Preview</title><link rel="stylesheet" href="preview.css"><script src="loader.js" defer></script></head>
<body><header><h1>Android UI Preview</h1><p>仅本地虚拟数据 · 不连接米游社 · 刷新后恢复默认 · 与 APK 的 Preview 构建无关</p>
